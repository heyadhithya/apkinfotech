name: Agent setup
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Prepare pinned agent tools
        run: bash scripts/cloud-setup.sh
      - name: Check repeated setup
        run: bash scripts/cloud-setup.sh
      - name: Check shell script
        run: shellcheck scripts/cloud-setup.sh
      - name: Check application
        run: npm run check
      - name: Smoke test production server
        run: |
          npm run start > "$RUNNER_TEMP/next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          npm run smoke
      - name: Build isolated pre-production demo
        run: PORTAL_DEMO_MODE=true npm run build
      - name: Smoke test demo and real-auth isolation
        run: |
          PORTAL_DEMO_MODE=true VERCEL=1 npm run start -- --port 3001 > "$RUNNER_TEMP/demo.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          node scripts/demo-smoke.mjs http://localhost:3001
